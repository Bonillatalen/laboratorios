<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClassroomHub{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { margin: 0; background: #f4f7fb; color: #17202a; line-height: 1.55; }
        .container { width: min(960px, calc(100% - 2rem)); margin: 0 auto; }
        header { background: #17324d; color: white; padding: 1rem 0; }
        header .container { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        header h1 { margin: 0; font-size: 1.35rem; }
        nav { display: flex; flex-wrap: wrap; gap: .75rem; }
        nav a { color: white; text-decoration: none; padding: .35rem .6rem; border-radius: .4rem; }
        nav a:hover, nav a:focus { background: #2d628f; }
        main { padding: 2.5rem 0; min-height: 65vh; }
        .hero, .card { background: white; border-radius: .8rem; padding: 1.5rem; box-shadow: 0 5px 20px rgba(23, 50, 77, .08); }
        .hero { border-left: .35rem solid #f2a65a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .resource { border: 1px solid #d5dfe8; border-radius: .6rem; padding: 1rem; background: #fff; }
        .badge { display: inline-block; border-radius: 999px; padding: .2rem .6rem; font-size: .85rem; font-weight: 700; }
        .available { color: #155724; background: #d4edda; }
        .pending { color: #856404; background: #fff3cd; }
        footer { border-top: 1px solid #d5dfe8; padding: 1rem 0; color: #5d6d7e; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>ClassroomHub</h1>
            <nav aria-label="Navegación principal">
                <a href="{% url 'pages:home' %}">Inicio</a>
                <a href="{% url 'pages:resources' %}">Recursos</a>
                <a href="{% url 'pages:about' %}">Acerca de</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container"><small>ClassroomHub · Laboratorio 06 de Django</small></div>
    </footer>
</body>
</html>
